<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O Último Sinal – Mesa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap">
<style>
@font-face{font-family:"Lokeya";src:url("Lokeya.otf") format("opentype");font-weight:100 900;font-display:swap;unicode-range:U+0030-0039,U+0041-005A,U+0061-007A}
:root{--f:"Lokeya","Montserrat",system-ui,sans-serif;color-scheme:dark;--ink:#e9e4d8;--mut:#9aa7b4;--ash:rgba(8,12,18,.84);--line:#2b3a4b;--glow:#62c9ff;--ember:#d9822b;--bad:#ff6b5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font:600 17px/1.4 var(--f);background:#080b10 url("fundo.jpg") center/cover fixed}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(5,8,12,.5),rgba(5,8,12,.78));z-index:-1}
h1,h2{margin:0;font-weight:400}
.ttl{font:600 52px/1 var(--f);letter-spacing:.02em}
.mut{color:var(--mut);margin:4px 0 0}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;max-width:1320px;margin:0 auto}
.left{display:grid;grid-template-rows:auto 1fr;gap:14px;min-width:0}
.top{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px}
.fr{position:relative;background:var(--ash);border:1px solid var(--line);padding:14px;backdrop-filter:blur(3px)}
.fr::before{content:"";position:absolute;inset:3px;border:1px solid rgba(98,201,255,.12);pointer-events:none}
.dice{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:210px;text-align:center}
.lbl{color:var(--mut);font-size:15px}
.dn{font:600 104px/1 var(--f);min-width:2ch;text-shadow:0 0 22px rgba(98,201,255,.55)}
.dn.hi{color:#a8e8ff;text-shadow:0 0 36px var(--glow)}
.dn.lo{color:var(--bad);text-shadow:0 0 26px rgba(255,107,90,.6)}
.by{min-height:1.3em;color:var(--mut)}
button{font:600 17px var(--f);color:#06121b;background:var(--glow);border:0;padding:10px 20px;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.info{display:flex;flex-direction:column;justify-content:center;gap:10px}
.inv{display:flex;gap:8px}
.master{display:grid;place-items:center;align-content:center;gap:12px;text-align:center;min-height:46vh}
.master img{max-width:min(100%,360px);max-height:42vh;border:1px solid var(--line)}
.pl{display:grid;gap:10px;align-content:start}
.pc{display:grid;grid-template-columns:72px 1fr;gap:12px}
.pc.empty{display:grid;place-items:center;min-height:96px;color:var(--mut);border:1px dashed var(--line);background:rgba(8,12,18,.5)}
.pc>img,.ph{width:72px;height:72px;object-fit:cover;border:1px solid var(--line);background:#0c131b center/cover}
.pn{font:600 20px/1.15 var(--f);overflow-wrap:anywhere}
.bar{position:relative;height:22px;background:#10161e;border:1px solid var(--line);margin:6px 0}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8a2a22,var(--ember));transition:width .4s}
.bar b{position:relative;display:block;text-align:center;font-size:15px;line-height:20px}
.dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:14px}
.dots span{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 8px var(--glow)}
.ctl{grid-column:1/-1;display:flex;gap:8px}
.ctl label,form label{display:grid;gap:2px;font-size:14px;color:var(--mut);flex:1}
input,select{font:inherit;color:var(--ink);background:#0b1118;border:1px solid var(--line);padding:8px;width:100%;min-width:0}
form.fr,.box{display:grid;gap:12px;grid-column:1/-1;width:100%;max-width:440px;margin:8vh auto}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0b1118;border:1px solid var(--glow);padding:8px 16px;z-index:5}
.msg:empty{display:none}
@media(max-width:860px){.wrap{grid-template-columns:1fr}.top{grid-template-columns:1fr}.dn{font-size:96px}.master{min-height:30vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.info{padding-right:104px}
.fotos{position:absolute;top:14px;right:14px;padding:0;width:76px;height:76px;border-radius:50%;background:none;border:1px solid var(--line);overflow:hidden;box-shadow:0 0 18px rgba(98,201,255,.35);transition:transform .2s}
.fotos:hover{transform:scale(1.06)}
.fotos img{width:100%;height:100%;display:block}
.gal{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));background:rgba(5,8,12,.94)}
.gal[hidden]{display:none}
.gh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gh h2{font:600 36px/1 var(--f);letter-spacing:.02em}
.gt{display:flex;gap:8px;overflow-x:auto}
.gt button{padding:0;width:96px;height:56px;background:none;border:1px solid var(--line);opacity:.7}
.gt button[aria-current=true]{border-color:var(--glow);opacity:1}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.gv{flex:1;min-height:0;overflow:auto;display:grid;place-items:center;border:1px solid var(--line)}
.gv img{max-width:100%;max-height:calc(100vh - 190px);cursor:zoom-in}
.gv.z{display:block}
.gv.z img{max-width:none;max-height:none;width:200%;cursor:zoom-out}
.gc{color:var(--mut);text-align:center;min-height:1.3em}
.dice select{width:auto;min-width:96px}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<div id="msg" class="msg" role="status"></div>
<div id="gal" class="gal" role="dialog" aria-modal="true" aria-label="Galeria de fotos" hidden>
<div class="gh"><h2>Fotos</h2><button id="galx" class="alt">Fechar</button></div>
<div id="gt" class="gt"></div>
<div id="gv" class="gv"><img id="gi" alt="" tabindex="0"></div>
<div id="gc" class="gc"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,collection,setDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// COLE AQUI a configuração do seu app web do Firebase (veja o README)
const firebaseConfig={apiKey:"AIzaSyArvcDvdaznVnILH7oJva3MP3tbHB86Jp0",authDomain:"o-ultimo-sinal-3bf9b.firebaseapp.com",projectId:"o-ultimo-sinal-3bf9b",appId:"1:551099165822:web:c0c8f34bbbabcf23157c2f"};
(()=>{
const app=document.getElementById('app'),msgEl=document.getElementById('msg');
function h(t,a,...k){const e=document.createElement(t);for(const[n,v]of Object.entries(a||{})){if(n==='class')e.className=v;else if(n.startsWith('on'))e.addEventListener(n.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(n,v===true?'':v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
let mt;function note(t){msgEl.textContent=t;clearTimeout(mt);mt=setTimeout(()=>msgEl.textContent='',3500)}
function shrink(file,px){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=px;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,px,px);ok(c.toDataURL('image/jpeg',.8))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
const okImg=s=>typeof s==='string'&&s.startsWith('data:image/');
const box=(t,p,...x)=>h('div',{class:'fr box'},h('h2',{class:'ttl'},t),h('p',{class:'mut'},p),...x);
const FOTOS=[{src:'andar-19.jpg',t:'Andar 19, Nível Habitacional',alt:'Mapa do Andar 19, nível habitacional, visto de cima: corredor circular em volta de um átrio central aberto, com dormitórios, refeitório, enfermaria e salas técnicas.'}];
const gal=document.getElementById('gal'),gv=document.getElementById('gv'),gi=document.getElementById('gi'),gt=document.getElementById('gt'),gc=document.getElementById('gc');
let galOpener=null;
function verFoto(i){const f=FOTOS[i];gv.classList.remove('z');gi.src=f.src;gi.alt=f.alt;gc.textContent=f.t;gv.scrollTo(0,0);[...gt.children].forEach((b,k)=>b.setAttribute('aria-current',k===i))}
function abrirGal(e){galOpener=e&&e.currentTarget;gt.replaceChildren(...(FOTOS.length>1?FOTOS.map((f,i)=>h('button',{class:'alt','aria-label':f.t,onclick:()=>verFoto(i)},h('img',{src:f.src,alt:''}))):[]));verFoto(0);gal.hidden=false;document.getElementById('galx').focus()}
function fecharGal(){gal.hidden=true;gi.removeAttribute('src');if(galOpener&&galOpener.isConnected)galOpener.focus()}
gi.addEventListener('click',()=>gv.classList.toggle('z'));
gi.addEventListener('keydown',e=>{if(e.key==='Enter')gv.classList.toggle('z')});
document.getElementById('galx').addEventListener('click',fecharGal);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!gal.hidden)fecharGal()});
let db,uid,code=null,room=null,players=[],me=null,loaded=0,unsubs=[],busy=false,timer,lastN=null,first=true,tm;

// dado
const diceNum=h('div',{class:'dn','aria-live':'polite'},'–'),diceBy=h('div',{class:'by'}),
rollBtn=h('button',{onclick:roll},'Rolar Dado'),
diceLbl=h('div',{class:'lbl'},'Dado de 20 faces'),
diceSel=h('select',{'aria-label':'Tipo de dado',hidden:true,onchange:e=>{db.doc('rooms/'+code).update({faces:+e.target.value}).catch(()=>note('Não foi possível trocar o dado.'))}},...Array.from({length:20},(_,i)=>h('option',{value:i+1,selected:i===19},'d'+(i+1)))),
diceFr=h('div',{class:'fr dice'},diceLbl,diceSel,diceNum,diceBy,rollBtn);
const myName=()=>room&&room.master===uid?room.mName:(me&&me.name)||'';
function diceUI(isM){const f=room.faces||20;diceLbl.textContent=f===1?'Dado de 1 face':'Dado de '+f+' faces';diceSel.hidden=!isM;if(isM)diceSel.value=f}
async function roll(){
  if(!db||!code||busy||!room||(room.master!==uid&&!me))return;
  busy=true;rollBtn.disabled=true;
  const f=room.faces||20,v=crypto.getRandomValues(new Uint32Array(1))[0]%f+1;
  try{await db.doc(`rooms/${code}/dice/last`).set({v,f,n:Date.now(),by:uid,name:myName()})}catch(e){note('Não foi possível rolar o dado.')}
  setTimeout(()=>{busy=false;rollBtn.disabled=false},900);
}
function show(d,instant){
  clearTimeout(tm);let k=0;
  const F=d.f||20,fin=()=>{diceNum.textContent=d.v;diceNum.classList.toggle('hi',F>1&&d.v===F);diceNum.classList.toggle('lo',F>1&&d.v===1);diceBy.textContent='d'+F+(d.name?', por '+d.name:'')};
  if(instant||matchMedia('(prefers-reduced-motion:reduce)').matches)return fin();
  diceNum.classList.remove('hi','lo');diceBy.textContent='';
  const t=()=>{if(k++<10){diceNum.textContent=1+Math.floor(Math.random()*F);tm=setTimeout(t,55+k*12)}else fin()};t();
}

// telas
function imgPicker(onPick,px){const ph=h('div',{class:'ph'});const f=h('input',{type:'file',accept:'image/*','aria-label':'Escolher imagem',onchange:async e=>{const x=e.target.files[0];if(!x)return;try{const d=await shrink(x,px);ph.style.backgroundImage='url("'+d+'")';onPick(d)}catch(_){note('Não foi possível ler essa imagem.')}}});return[ph,f]}
function home(){
  let img='';
  const nm=h('input',{required:true,maxlength:24,placeholder:'Nome do mestre'}),
  n=h('select',{'aria-label':'Número de jogadores'},...[1,2,3,4,5,6,7,8].map(i=>h('option',{value:i,selected:i===5},i))),
  [ph,f]=imgPicker(d=>img=d,360);
  return h('form',{class:'fr',onsubmit:async e=>{
    e.preventDefault();
    const c=Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
    try{await db.doc('rooms/'+c).set({master:uid,max:+n.value,mName:nm.value.trim(),mImg:img,at:Date.now()});location.hash='sala-'+c}
    catch(_){note('Você não tem permissão para criar salas aqui.')}
  }},
  h('h1',{class:'ttl'},'O Último Sinal'),h('p',{class:'mut'},'Crie uma sala e chame seus jogadores.'),
  h('label',{},'Seu nome',nm),h('label',{},'Quantos jogadores?',n),h('label',{},'Imagem do mestre (opcional)',ph,f),
  h('button',{type:'submit'},'Criar sala'));
}
function joinForm(){
  let img='';
  const nm=h('input',{required:true,maxlength:24,placeholder:'Nome do personagem'}),
  hp=h('input',{type:'number',min:1,max:999,value:20,required:true}),
  dt=h('input',{type:'number',min:0,max:99,value:3,required:true}),
  [ph,f]=imgPicker(d=>img=d,160);
  return h('form',{class:'fr',onsubmit:async e=>{
    e.preventDefault();
    try{await db.doc(`rooms/${code}/players/${uid}`).set({name:nm.value.trim(),img,hp:+hp.value,maxHp:+hp.value,det:+dt.value,at:Date.now()})}
    catch(_){note('Não foi possível entrar. Peça ao mestre para te dar acesso como colaborador.')}
  }},
  h('h1',{class:'ttl'},'Entrar na mesa'),h('p',{class:'mut'},'Sala '+code),
  h('label',{},'Nome',nm),h('label',{},'Imagem',ph,f),h('label',{},'Vida inicial',hp),h('label',{},'Determinação',dt),
  h('button',{type:'submit'},'Entrar'));
}
const num=(lbl,key,p)=>h('label',{},lbl,h('input',{type:'number',min:0,max:999,value:p[key],onchange:e=>{
  const v=Math.max(0,Math.min(999,parseInt(e.target.value,10)||0));
  db.doc(`rooms/${code}/players/${p.id}`).update({[key]:v}).catch(()=>note('Não foi possível salvar.'))}}));
function card(p,isM){
  const pct=p.maxHp?Math.max(0,Math.min(100,p.hp/p.maxHp*100)):0,d=Math.min(p.det||0,12);
  return h('div',{class:'pc'},
    okImg(p.img)?h('img',{src:p.img,alt:''}):h('div',{class:'ph'}),
    h('div',{},h('div',{class:'pn'},p.name),
      h('div',{class:'bar'},h('i',{style:'width:'+pct.toFixed(0)+'%'}),h('b',{},p.hp+'/'+p.maxHp)),
      h('div',{class:'dots'},...Array.from({length:d},()=>h('span')),h('span',{style:'background:none;box-shadow:none;width:auto;height:auto'},'Determinação '+p.det))),
    isM&&h('div',{class:'ctl'},num('Vida','hp',p),num('Vida máx.','maxHp',p),num('Determ.','det',p)));
}
function game(isM){
  const link=location.href.split('#')[0]+'#sala-'+code;
  const info=h('div',{class:'fr info'},h('h1',{class:'ttl'},'O Último Sinal'),
    h('p',{class:'mut'},`Sala ${code}, ${players.length} de ${room.max} jogadores`),
    isM&&h('div',{class:'inv'},h('input',{readonly:true,value:link,'aria-label':'Link de convite',onfocus:e=>e.target.select()}),
      h('button',{onclick:()=>navigator.clipboard.writeText(link).then(()=>note('Link copiado.'),()=>note('Selecione o link e copie.'))},'Copiar')),
    h('button',{class:'fotos',title:'Acessar fotos','aria-label':'Acessar fotos',onclick:abrirGal},h('img',{src:'botao-fotos.jpg',alt:''})));
  const master=h('div',{class:'fr master'},okImg(room.mImg)&&h('img',{src:room.mImg,alt:''}),h('h2',{class:'ttl'},room.mName||'Mestre'),h('div',{class:'lbl'},'Mestre'));
  const slots=Array.from({length:room.max},(_,i)=>players[i]?h('div',{class:'fr'},card(players[i],isM)):h('div',{class:'pc empty'},'Vaga livre'));
  return h('div',{style:'display:contents'},h('div',{class:'left'},h('div',{class:'top'},diceFr,info),master),h('div',{class:'pl'},slots));
}
function draw(){
  if(loaded<3)return;
  clearTimeout(timer);
  if(!room)return app.replaceChildren(box('Sala não encontrada','Confira o link com o mestre.',h('button',{onclick:()=>{location.hash=''}},'Criar uma sala')));
  const isM=room.master===uid;me=players.find(p=>p.id===uid)||null;diceUI(isM);
  if(!isM&&!me)return app.replaceChildren(players.length>=room.max?box('Sala cheia','Todas as vagas já foram preenchidas.'):joinForm());
  app.replaceChildren(game(isM));
}
function go(){
  if(!gal.hidden)fecharGal();
  unsubs.forEach(f=>f());unsubs=[];room=null;players=[];me=null;loaded=0;lastN=null;first=true;clearTimeout(timer);
  diceNum.textContent='–';diceNum.className='dn';diceBy.textContent='';
  const m=/^#sala-([a-z0-9]{6})$/.exec(location.hash);code=m&&m[1];
  if(!code)return app.replaceChildren(home());
  app.replaceChildren(h('p',{class:'fr box'},'Entrando na sala…'));
  timer=setTimeout(()=>{if(loaded<3)app.replaceChildren(box('Sem resposta','Confira se você abriu o link logado na Claude e com acesso à mesa.'))},10000);
  const R=db.doc('rooms/'+code),err=()=>app.replaceChildren(box('Sem acesso à sala','Peça ao mestre para te dar acesso como colaborador.'));
  unsubs.push(
    R.onSnapshot(s=>{room=s.exists?s.data():null;loaded|=1;draw()},err),
    R.collection('players').onSnapshot(s=>{players=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));loaded|=2;draw()},err),
    R.collection('dice').doc('last').onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&d.n!==lastN){show(d,first);lastN=d.n}first=false},()=>{}));
}
(async()=>{
  try{
    if(firebaseConfig.apiKey==='COLE_AQUI')throw 0;
    const fapp=initializeApp(firebaseConfig),auth=getAuth(fapp),fdb=getFirestore(fapp);
    await signInAnonymously(auth);uid=auth.currentUser.uid;
    const wd=p=>{const r=doc(fdb,p);return{set:d=>setDoc(r,d),update:d=>updateDoc(r,d),onSnapshot:(n,x)=>onSnapshot(r,s=>n({exists:s.exists(),data:()=>s.data()}),x),collection:c=>wc(p+'/'+c)}},
    wc=p=>{const r=collection(fdb,p);return{onSnapshot:(n,x)=>onSnapshot(r,s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),x),doc:id=>wd(p+'/'+id)}};
    db={doc:wd};
  }catch(_){}
  if(!db||!uid)return app.replaceChildren(box('Mesa indisponível','Não consegui conectar ao Firebase. Confira a configuração no index.html e se o login anônimo está ativado.',h('button',{onclick:()=>location.reload()},'Tentar de novo')));
  addEventListener('hashchange',go);go();
})();
})();
</script>
</body>
</html>
